rvm: true
before_script:
  - bundle exec appraisal bundle
  - bundle exec rails db:schema:load
builds:
  build_1:
    paths:
      - "app/**"
      - "config/**"
      - "db/**"
      - "lib/**"
      - "spec/**"
      - ".rspec"
      - "bin/rails"
      - "Gemfile"
      - "Gemfile.lock"
      - "Appraisals"
      - "Rakefile"
      - "jobler.gemspec"
      - ".ruby-version"
      - "peak_flow.yml"
      - ".github/**"
      - "gemfiles/rails_6.gemfile"
      - "gemfiles/rails_6.gemfile.lock"
      - "!gemfiles/rails_7.gemfile"
      - "!gemfiles/rails_7.gemfile.lock"
    environment:
      RUBY_VERSION: 2.7.5
    name: Ruby 2.7.5, Rails 6
    script:
      - bundle exec appraisal "rails 6" rspec
