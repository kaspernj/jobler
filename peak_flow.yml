rvm: true
before_install:
  - >-
    sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get
    -o Acquire::Retries=5 update
  - >-
    sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get
    -o Acquire::Retries=5 install --yes
    build-essential libffi-dev libreadline-dev libsqlite3-dev libssl-dev
    libyaml-dev pkg-config zlib1g-dev
builds:
  build_1:
    paths:
      - "app/**"
      - "config/**"
      - "db/**"
      - "lib/**"
      - "spec/**"
      - ".rspec"
      - "bin/rails"
      - "Gemfile"
      - "Gemfile.lock"
      - "Appraisals"
      - "Rakefile"
      - "jobler.gemspec"
      - ".ruby-version"
      - "peak_flow.yml"
      - ".github/**"
      - "gemfiles/rails_7.gemfile"
      - "gemfiles/rails_7.gemfile.lock"
      - "!gemfiles/rails_8.gemfile"
      - "!gemfiles/rails_8.gemfile.lock"
    environment:
      RUBY_VERSION: 3.4.13
    name: Ruby 3.4.13, Rails 7
    before_script:
      - echo "3.4.13" > .ruby-version
      - gem install bundler --no-document
      - BUNDLE_GEMFILE=gemfiles/rails_7.gemfile bundle install --jobs 4
      - BUNDLE_GEMFILE=gemfiles/rails_7.gemfile bundle exec rails db:schema:load
    script:
      - BUNDLE_GEMFILE=gemfiles/rails_7.gemfile bundle exec rspec
